<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Darts · one darts puzzle a day</title>
    <meta
      name="description"
      content="A daily darts checkout puzzle. Everyone gets the same three scores; finish each on a double in as few darts as you can. Free, in your browser."
    />
    <meta name="theme-color" content="#1e2523" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Link previews (Open Graph, used by iMessage, WhatsApp, Slack, Discord, Facebook, X...).
      %SITE_URL% is filled in at build time from VITE_SITE_URL (see vite.config.ts).
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daily Darts" />
    <meta property="og:title" content="Daily Darts" />
    <meta
      property="og:description"
      content="One darts puzzle a day, the same for everyone. Check out three scores in the fewest darts."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A dartboard next to the words Daily Darts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Darts" />
    <meta
      name="twitter:description"
      content="One darts puzzle a day, the same for everyone. Check out three scores in the fewest darts."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
