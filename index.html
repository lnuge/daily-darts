<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2523" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Everything between page-meta:start and page-meta:end is per page: title, description,
      canonical URL and link previews (Open Graph, used by iMessage, WhatsApp, Slack, X...).
      The build replaces it on every prerendered page (scripts/prerender.mjs, from
      src/ui/pageMeta.ts), and the app keeps it up to date as you move around
      (useDocumentMeta). What's here is the home page's, for `npm run dev`. The site URL
      placeholders are filled in from VITE_SITE_URL at build time (see vite.config.ts).
    -->
    <!--page-meta:start-->
    <title>Daily Darts – A New Darts Checkout Puzzle Every Day</title>
    <meta
      name="description"
      content="A free darts checkout puzzle you play in your browser. Every day everyone gets the same three scores: finish each one on a double in as few darts as you can."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daily Darts" />
    <meta property="og:title" content="Daily Darts – A New Darts Checkout Puzzle Every Day" />
    <meta
      property="og:description"
      content="One darts puzzle a day, the same for everyone. Check out three scores in the fewest darts."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A dartboard next to the words Daily Darts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Darts – A New Darts Checkout Puzzle Every Day" />
    <meta
      name="twitter:description"
      content="One darts puzzle a day, the same for everyone. Check out three scores in the fewest darts."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <!--page-meta:end-->
  </head>
  <body>
    <!-- Prerendered pages put the page's HTML here; the app replaces it when it starts. -->
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
